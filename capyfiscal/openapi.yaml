        orientacao_danfe: *id029
        recibo_danfe: *id030
        serie_nfe_producao: *id031
        proximo_numero_nfe_producao: *id032
        serie_nfe_homologacao: *id033
        proximo_numero_nfe_homologacao: *id034
        certificado_especifico: *id035
        certificado_valido_de:
          type: string
          nullable: true
        certificado_valido_ate:
          type: string
          nullable: true
        certificado_cnpj:
          type: string
          nullable: true
        data_ultima_emissao:
          type: string
          nullable: true
        ativo:
          type: boolean
    EmpresaCriada:
      allOf:
      - $ref: '#/components/schemas/Empresa'
      - type: object
        properties:
          token_producao:
            type: string
            description: Token da empresa para produção. Aparece só nesta resposta.
          token_homologacao:
            type: string
            description: Token da empresa para o ambiente de testes. Aparece só nesta resposta.
    Simulacao:
      type: object
      properties:
        dry_run:
          type: boolean
        mensagem: *id006
    Status:
      type: object
      properties:
        api:
          type: string
          enum:
          - ok
          - erro
        ambiente:
          type: integer
          description: 1 = produção, 2 = testes.
        sefaz:
          type: object
          nullable: true
          properties:
            cStat:
              type: string
              description: 107 = em operação; 108 ou 109 = paralisada.
            xMotivo: *id006
            consultado_em: *id006
      example:
        api: ok
        ambiente: 1
        sefaz:
          cStat: '107'
          xMotivo: Servico em Operacao
          consultado_em: '2026-11-03T10:30:00-03:00'
  responses:
    NaoAutorizado:
      description: Token ausente, inválido ou de outro ambiente.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Erro'
          example:
            codigo: nao_autorizado
            mensagem: Token inválido ou ausente.
    NaoEncontrado:
      description: Não encontrado.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Erro'
          example:
            codigo: nao_encontrado
            mensagem: Nota fiscal não encontrada.
    SemCorpo:
      description: A requisição chegou sem corpo JSON.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Erro'
          example:
            codigo: formato_invalido
            mensagem: Recebida requisição vazia quando eram esperados dados.
    LimiteExcedido:
      description: Limite de requisições por minuto excedido.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Erro'
          example:
            codigo: limite_excedido
            mensagem: Limite de 100 requisições por minuto excedido para este token.
