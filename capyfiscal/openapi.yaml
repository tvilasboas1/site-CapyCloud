openapi: 3.0.3
info:
  title: CapyFiscal API
  version: '1.0'
  description: 'API de emissão de NF-e (modelo 55, layout 4.00) da Capycloud.


    Autenticação: HTTP Basic com o token como usuário e senha em branco, ou Bearer. Há um token para o ambiente de testes
    (homologação) e outro para produção.'
  contact:
    name: Capycloud
    url: https://www.capycloud.com.br
servers:
- url: https://api-fiscal.capycloud.com.br/v2
  description: Produção (tpAmb=1)
- url: https://homologacao-fiscal.capycloud.com.br/v2
  description: Homologação (tpAmb=2)
security:
- BasicAuth: []
- BearerAuth: []
tags:
- name: NFe
- name: Webhooks
- name: Empresas
paths:
  /nfe:
    post:
      tags:
      - NFe
      summary: Emitir
      description: 'Recebe o payload da NF-e e inicia o envio para autorização na SEFAZ.

        Por padrão, o fluxo é **assíncrono**: a API confirma o recebimento da requisição e a nota segue em fila até o processamento.
        Quando permitido pelo estado e pela configuração da conta, a emissão pode ocorrer de forma **síncrona**, com o resultado
        retornado na mesma requisição.

        Para acompanhar o status até a autorização, use a consulta da nota ou os webhooks.

        A NF-e na versão 4.00 admite muitos campos; o schema NFeRequest lista os principais.'
      operationId: emitir_nfe
      parameters:
      - name: ref
        in: query
        required: true
        description: Referência única da NFe no seu sistema
        schema:
          type: string
          example: '12345'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/NFeRequest'
      responses:
        '201':
          description: NFe autorizada (emissão síncrona)
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/NFeAutorizadaResponse'
              examples:
                NFe autorizada:
                  $ref: '#/components/examples/NFeAutorizada'
        '202':
          description: NFe em processamento (emissão assíncrona)
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/NFeProcessandoResponse'
              examples:
                Processando autorização:
                  $ref: '#/components/examples/ProcessandoAutorizacao'
        '400':
          description: Requisição inválida
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
              example:
                codigo: requisicao_invalida
                mensagem: Parâmetro "ref" não informado.
        '401':
          $ref: '#/components/responses/AccessDenied'
        '415':
          $ref: '#/components/responses/InvalidMediaType'
        '422':
          description: O servidor entendeu a requisição, mas os dados são inválidos ou não podem ser processados
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
              examples:
                Permissão negada:
                  $ref: '#/components/examples/PermissaoNegada'
                Operação pendente:
                  value:
                    codigo: pending_operation
                    mensagem: A nota fiscal ainda está em processamento.
                Nota fiscal já autorizada:
                  value:
                    codigo: already_processed
                    mensagem: A nota fiscal já foi autorizada.
                Erro de validação:
                  value:
                    codigo: erro_validacao_schema
                    mensagem: Erro na validação do Schema XML, verifique o detalhamento dos erros.
                    erros:
                    - mensagem: Tipo documento não pode ser vazio
                      campo: tipo_documento
  /nfe/{referencia}:
    delete:
      tags:
      - NFe
      summary: Cancelar
      description: "Cancela uma NFe já autorizada.\n\nEste método é **síncrono**, ou seja, a comunicação com a SEFAZ será\
        \ feita imediatamente.\n\nA NFe poderá ser cancelada em até 24 horas após a emissão. No entanto, alguns estados \n\
        podem permitir um prazo maior para o cancelamento.\n"
      operationId: cancelar_nfe
      parameters:
      - name: referencia
        in: path
        required: true
        description: Referência da NFe
        schema:
          type: string
          example: '12345'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CancelamentoNFeRequest'
      responses:
        '200':
          description: NFe cancelada com sucesso
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CancelamentoNFeResponse'
        '400':
          description: Requisição inválida
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
              example:
                codigo: requisicao_invalida
                mensagem: Parâmetro "justificativa" deve ter entre 15 e 255 caracteres.
        '401':
          $ref: '#/components/responses/AccessDenied'
        '404':
          $ref: '#/components/responses/NotFound'
        '415':
          $ref: '#/components/responses/InvalidMediaType'
        '422':
          description: O servidor entendeu a requisição, mas os dados são inválidos ou não podem ser processados
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
              examples:
                Não autorizada:
                  $ref: '#/components/examples/NaoAutorizado'
    get:
      tags:
      - NFe
      summary: Consultar
      description: 'Consulta o status de uma NFe emitida.


        Retorna informações sobre o processamento da nota, incluindo status de autorização,

        caminhos para download do XML e DANFe, e dados de eventos associados.

        '
      operationId: consultar_nfe
      parameters:
      - name: referencia
        in: path
        required: true
        description: Referência da NFe
        schema:
          type: string
          example: '12345'
      - name: completa
        in: query
        required: false
        description: Se informado como 1, retorna dados completos da requisição e protocolo
        schema:
          type: integer
          enum:
          - 0
          - 1
          example: 1
      responses:
        '200':
          description: Requisição processada com sucesso
          content:
            application/json:
              schema:
                oneOf:
                - $ref: '#/components/schemas/NFeProcessandoResponse'
                - $ref: '#/components/schemas/NFeAutorizadaResponse'
                - $ref: '#/components/schemas/CanceladaResponse'
                - $ref: '#/components/schemas/ErroAutorizacaoResponse'
              examples:
                Processando autorização:
                  $ref: '#/components/examples/ProcessandoAutorizacao'
                Autorizada:
                  $ref: '#/components/examples/NFeAutorizada'
                Autorizada completa:
                  $ref: '#/components/examples/NFeAutorizadaCompleta'
                Cancelada:
                  $ref: '#/components/examples/CanceladaResponse'
                Erro autorização:
                  $ref: '#/components/examples/ErroAutorizacaoResponse'
        '401':
          $ref: '#/components/responses/AccessDenied'
        '404':
          $ref: '#/components/responses/NotFound'
  /nfe/{referencia}/carta_correcao:
    post:
      tags:
      - NFe
      summary: Emitir Carta de Correção
      description: "Emite uma Carta de Correção Eletrônica (CCe) para uma NFe autorizada.\n\nEste método é **síncrono**, ou\
        \ seja, a comunicação com a SEFAZ será feita imediatamente.\n\nA CCe pode ser utilizada para corrigir eventuais erros\
        \ na NFe. As seguintes informações \n**não podem ser corrigidas**:\n- As variáveis que determinam o valor do imposto\
        \ (base de cálculo, alíquota, etc.)\n- A correção de dados cadastrais que implique mudança do remetente ou do destinatário\n\
        - A data de emissão ou de saída\n\nÉ possível enviar até 20 correções diferentes, sendo que será válido sempre a última\
        \ correção enviada.\n"
      operationId: emitir_carta_correcao
      parameters:
      - name: referencia
        in: path
        required: true
        description: Referência da NFe
        schema:
          type: string
          example: '12345'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CartaCorrecaoRequest'
      responses:
        '200':
          description: Carta de correção autorizada
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CartaCorrecaoResponse'
        '400':
          description: Requisição inválida
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
              examples:
                Requisição inválida:
                  value:
                    codigo: requisicao_invalida
                    mensagem: Parâmetro "correcao" deve ter entre 15 e 1000 caracteres.
                Não autorizada:
                  $ref: '#/components/examples/NaoAutorizado'
        '401':
          $ref: '#/components/responses/AccessDenied'
        '404':
          $ref: '#/components/responses/NotFound'
        '415':
          $ref: '#/components/responses/InvalidMediaType'
  /nfe/inutilizacao:
    post:
      tags:
      - NFe
      summary: Inutilizar Numeração
      description: "Inutiliza uma faixa de numeração de NFe.\n\nEm uma situação normal você não precisará informar ao SEFAZ\
        \ a inutilização de um número \nda NFe, pois a API controla automaticamente a numeração das notas. Porém, se por alguma\
        \ \nsituação específica for necessário a inutilização de alguma faixa de números você poderá \nusar este endpoint.\n\
        \nEste método é **síncrono**.\n"
      operationId: inutilizar_numeracao
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/InutilizacaoRequest'
      responses:
        '200':
          description: Inutilização realizada
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/InutilizacaoResponse'
              examples:
                Autorização:
                  value:
                    status_sefaz: 102
                    mensagem_sefaz: Inutilizacao de numero homologado
                    serie: 1
                    numero_inicial: 999
                    numero_final: 1000
                    modelo: 55
                    cnpj: 12345678000123
                    status: autorizado
                    caminho_xml: /arquivos_development/123456789/201906/XMLs/190750450500010000001000000999000001000-inu.xml
                    protocolo_sefaz: 135210002233889
                Rejeição:
                  value:
                    status_sefaz: 215
                    mensagem_sefaz: 'Rejeição: Falha no schema XML'
                    cnpj: 12345678000123
                    modelo: 55
                    serie: 1
                    numero_inicial: 1
                    numero_final: 1000
                    status: erro_autorizacao
        '400':
          description: Requisição inválida
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
              examples:
                Não autorizada:
                  $ref: '#/components/examples/NaoAutorizado'
                Requisição inválida:
                  value:
                    codigo: requisicao_invalida
                    mensagem: Parâmetros "cnpj" ou "cpf" não informados.
                Número inválido:
                  value:
                    codigo: requisicao_invalida
                    mensagem: 'Parâmetro "numero_inicial" inválido: informe apenas números (dígitos de 0 a 9)'
        '401':
          $ref: '#/components/responses/AccessDenied'
        '404':
          $ref: '#/components/responses/NotFound'
        '415':
          $ref: '#/components/responses/InvalidMediaType'
        '422':
          description: O servidor entendeu a requisição, mas os dados são inválidos ou não podem ser processados
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
              examples:
                Permissão negada:
                  $ref: '#/components/examples/PermissaoNegada'
  /nfe/inutilizacoes:
    get:
      tags:
      - NFe
      summary: Consultar Inutilizações
      description: "Consulta XMLs de numerações inutilizadas.\n\nPermite consultar as faixas de numeração de notas fiscais\
        \ eletrônicas (NF-e) \ndeclaradas como não utilizadas.\n"
      operationId: consultar_inutilizacoes
      parameters:
      - name: cnpj
        in: query
        description: CNPJ da empresa (obrigatório se não informado CPF)
        schema:
          type: string
          example: '12345678000123'
      - name: cpf
        in: query
        description: CPF da empresa (obrigatório se não informado CNPJ)
        schema:
          type: string
      - name: data_recebimento_inicial
        in: query
        description: Data inicial de recebimento da inutilização pela SEFAZ
        schema:
          type: string
          format: date
      - name: data_recebimento_final
        in: query
        description: Data final de recebimento da inutilização pela SEFAZ
        schema:
          type: string
          format: date
      - name: numero_inicial
        in: query
        description: Número inicial inutilizado
        schema:
          type: integer
      - name: numero_final
        in: query
        description: Número final inutilizado
        schema:
          type: integer
      responses:
        '200':
          description: Lista de inutilizações
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/InutilizacaoResponse'
        '400':
          description: Requisição inválida
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
              examples:
                Requisição inválida:
                  value:
                    codigo: requisicao_invalida
                    mensagem: Parâmetros "cnpj" ou "cpf" não informados.
        '401':
          $ref: '#/components/responses/AccessDenied'
  /nfe/{referencia}/email:
    post:
      tags:
      - NFe
      summary: Enviar NFe por Email
      description: "Envia a NFe por email para os destinatários informados.\n\nA API imediatamente devolve a requisição com\
        \ a confirmação dos emails. \nOs emails serão enviados em segundo plano, por isso pode levar alguns minutos \naté\
        \ que eles cheguem à caixa postal.\n"
      operationId: enviar_email_nfe
      parameters:
      - name: referencia
        in: path
        required: true
        description: Referência da NFe
        schema:
          type: string
          example: '12345'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/EnvioEmailRequest'
      responses:
        '200':
          description: Emails agendados para envio
          content:
            application/json:
              schema:
                type: object
                properties:
                  mensagem:
                    type: string
                    description: Mensagem de confirmação
        '400':
          description: Requisição inválida
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
              examples:
                Não autorizada:
                  $ref: '#/components/examples/NaoAutorizado'
                Requisição inválida:
                  value:
                    codigo: requisicao_invalida
                    mensagem: Parâmetro "emails" não informado.
        '401':
          $ref: '#/components/responses/AccessDenied'
        '404':
          $ref: '#/components/responses/NotFound'
        '415':
          $ref: '#/components/responses/InvalidMediaType'
  /nfe/{referencia}/hook:
    post:
      tags:
      - NFe
      summary: Solicitar reenvio de notificação de NFe
      description: Para efeitos de teste ou para recuperar notificações perdidas é possível solicitar à API o reenvio desta
        notificação para todos os gatilhos cadastrados.
      operationId: reenviar_hook_nfe
      parameters:
      - name: referencia
        in: path
        required: true
        description: Referência da NFe
        schema:
          type: string
      responses:
        '200':
          description: Lista de gatilhos acionados
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/Hook'
  /nfe/danfe:
    post:
      tags:
      - NFe
      summary: Pré-visualização de DANFe
      description: 'Gera uma DANFe de preview para visualização.


        A DANFe gerada por este endpoint é apenas para fins de visualização e **não possui valor fiscal**.

        Para a emissão de uma NFe com valor fiscal, utilize o processo de emissão padrão.

        '
      operationId: previsualizar_danfe
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/NFeRequest'
          application/xml:
            schema:
              type: string
              description: Conteúdo do XML da NFe
      responses:
        '200':
          description: DANFe gerada com sucesso
          content:
            application/pdf:
              schema:
                type: string
                format: binary
        '401':
          $ref: '#/components/responses/AccessDenied'
  /hooks/{id}:
    get:
      tags:
      - Webhooks
      summary: Consultar por ID
      operationId: consultar_webhook
      parameters:
      - name: id
        in: path
        required: true
        description: Identificador do gatilho
        schema:
          type: string
      responses:
        '200':
          description: Gatilho encontrado
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Hook'
    delete:
      tags:
      - Webhooks
      summary: Excluir
      operationId: excluir_webhook
      parameters:
      - name: id
        in: path
        required: true
        description: Identificador do gatilho
        schema:
          type: string
      responses:
        '200':
          description: Gatilho excluído com sucesso
          content:
            application/json:
              schema:
                allOf:
                - $ref: '#/components/schemas/Hook'
                - type: object
                  properties:
                    deleted:
                      type: boolean
                      example: true
  /hooks:
    post:
      tags:
      - Webhooks
      summary: Criar
      description: 'Cria um novo gatilho para receber notificações de eventos.

        '
      operationId: criar_webhook
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/HookCreateRequest'
            example:
              cnpj: '12345678000123'
              event: nfe
              url: http://minha.url/nfe
      responses:
        '200':
          description: Gatilho criado com sucesso
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Hook'
              example:
                id: Vj5rmkBq
                url: http://minha.url/nfe
                authorization: null
                authorization_header: null
                event: nfe
                cnpj: '12345678000123'
        '400':
          description: Requisição inválida
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '404':
          $ref: '#/components/responses/HookNaoEncontrado'
    get:
      tags:
      - Webhooks
      summary: Listar
      description: Lista todos os gatilhos cadastrados para o token.
      operationId: listar_webhooks
      responses:
        '200':
          description: Lista de gatilhos
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/Hook'
        '400':
          description: Requisição inválida
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
  /empresas/{id}:
    put:
      tags:
      - Empresas
      summary: Atualizar
      description: 'Altera os dados de uma empresa. Utilize `dry_run=1` para simular a alteração sem efetivar no banco de
        dados.

        '
      operationId: atualizar_empresa
      parameters:
      - name: id
        in: path
        required: true
        description: Identificador único da empresa
        schema:
          type: string
          example: '123'
      - name: dry_run
        in: query
        required: false
        description: Simula a alteração da empresa sem persistir os dados
        schema:
          type: integer
          enum:
          - 1
          example: 1
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/EmpresaCreate'
            example:
              nome: Nome da empresa Ltda
              nome_fantasia: Nome Fantasia
              bairro: Vila Isabel
              cep: 80210000
              cnpj: '12345678000123'
              complemento: Loja 1
              discrimina_impostos: true
              email: test@example.com
              enviar_email_destinatario: true
              inscricao_estadual: 1234
              inscricao_municipal: 46532
              logradouro: Rua João da Silva
              numero: '153'
              regime_tributario: 1
              telefone: '4130333333'
              municipio: Curitiba
              uf: PR
      responses:
        '200':
          description: Requisição processada com sucesso
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/EmpresaResponse'
              examples:
                Empresa atualizada com sucesso:
                  $ref: '#/components/examples/EmpresaResponse'
        '400':
          $ref: '#/components/responses/ParametrosInvalidos'
        '401':
          $ref: '#/components/responses/AccessDenied'
        '404':
          $ref: '#/components/responses/EmpresaNaoEncontrada'
        '422':
          description: O servidor entendeu a requisição, mas os dados são inválidos ou não podem ser processados
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ValidationErrorResponse'
              example:
                codigo: erro_validacao
                mensagem: Erro de validação
                erros:
                - codigo: erro_validacao
                  mensagem: Arquivo certificado base64 Certificado não pertence ao CNPJ informado
                  campo: arquivo_certificado_base64
    get:
      tags:
      - Empresas
      summary: Consultar por ID
      description: Retorna os dados de uma empresa.
      operationId: consultar_empresa_por_id
      parameters:
      - name: id
        in: path
        required: true
        description: Identificador único da empresa
        schema:
          type: string
          example: '123'
      responses:
        '200':
          description: Requisição processada com sucesso
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/EmpresaResponse'
              examples:
                Empresa consultada com sucesso:
                  $ref: '#/components/examples/EmpresaResponse'
        '401':
          $ref: '#/components/responses/AccessDenied'
        '404':
          $ref: '#/components/responses/EmpresaNaoEncontrada'
        '422':
          $ref: '#/components/responses/PermissaoNegada'
    delete:
      tags:
      - Empresas
      summary: Excluir
      description: 'Exclui uma empresa e retorna seus dados. Esta operação não é reversível.

        '
      operationId: excluir_empresa
      parameters:
      - name: id
        in: path
        required: true
        description: Identificador único da empresa
        schema:
          type: string
          example: '123'
      responses:
        '200':
          description: Requisição processada com sucesso
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/EmpresaResponse'
              examples:
                Empresa excluída com sucesso:
                  $ref: '#/components/examples/EmpresaResponse'
        '401':
          $ref: '#/components/responses/AccessDenied'
        '404':
          $ref: '#/components/responses/EmpresaNaoEncontrada'
        '422':
          $ref: '#/components/responses/PermissaoNegada'
  /empresas:
    post:
      tags:
      - Empresas
      summary: Criar
      description: 'Cria uma nova empresa. Utilize `dry_run=1` para simular a criação sem efetivar no banco de dados.

        '
      operationId: criar_empresa
      parameters:
      - name: dry_run
        in: query
        required: false
        description: Simula a criação da empresa sem persistir os dados
        schema:
          type: integer
          enum:
          - 1
          example: 1
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/EmpresaCreate'
            example:
              nome: Nome da empresa Ltda
              nome_fantasia: Nome Fantasia
              bairro: Vila Isabel
              cep: 80210000
              cnpj: '12345678000123'
              complemento: Loja 1
              discrimina_impostos: true
              email: test@example.com
              enviar_email_destinatario: true
              inscricao_estadual: 1234
              inscricao_municipal: 46532
              logradouro: Rua João da Silva
              numero: '153'
              regime_tributario: 1
              telefone: '4130333333'
              municipio: Curitiba
              uf: PR
              habilita_nfe: true
              arquivo_certificado_base64: MIIj4gIBAzCCI54GCSqGSIb3DQEHAaCC..apagado…ASD==
              senha_certificado: 123456
      responses:
        '200':
          description: Requisição processada com sucesso
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/EmpresaResponse'
              examples:
                Empresa criada com sucesso:
                  $ref: '#/components/examples/EmpresaResponse'
        '400':
          $ref: '#/components/responses/ParametrosInvalidos'
        '401':
          $ref: '#/components/responses/AccessDenied'
        '422':
          description: O servidor entendeu a requisição, mas os dados são inválidos ou não podem ser processados
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ValidationErrorResponse'
              examples:
                Certificado inválido:
                  value:
                    codigo: erro_validacao
                    mensagem: Erro de validação
                    erros:
                    - codigo: erro_validacao
                      mensagem: Arquivo certificado base64 Houve um erro ao instalar o certificado, verifique se a senha está
                        correto e o arquivo está no formato PFX ou P12 codificado em base64
                      campo: arquivo_certificado_base64
                Certificado não pertence ao CNPJ:
                  value:
                    codigo: erro_validacao
                    mensagem: Erro de validação
                    erros:
                    - codigo: erro_validacao
                      mensagem: Arquivo certificado base64 Certificado não pertence ao CNPJ informado
                      campo: arquivo_certificado_base64
                Certificado vencido:
                  value:
                    codigo: erro_validacao
                    mensagem: Erro de validação
                    erros:
                    - codigo: erro_validacao
                      mensagem: Arquivo certificado base64 Certificado com prazo de validade vencido
                      campo: arquivo_certificado_base64
    get:
      tags:
      - Empresas
      summary: Listar
      description: 'Lista empresas com suporte a filtros e paginação. Cada página retorna até 50 registros.

        '
      operationId: listar_empresas
      parameters:
      - name: cnpj
        in: query
        required: false
        description: Número do CNPJ da empresa (somente números)
        schema:
          type: string
          pattern: ^[0-9]{14}$
          example: '12345678000123'
      - name: cpf
        in: query
        required: false
        description: Número do CPF da empresa (somente números)
        schema:
          type: string
          pattern: ^[0-9]{11}$
          example: '12345678909'
      - name: offset
        in: query
        required: false
        description: Deslocamento para paginação. Cada página retorna até 50 registros.
        schema:
          type: integer
          minimum: 0
          example: 50
      responses:
        '200':
          description: Requisição processada com sucesso
          headers:
            X-Total-Count:
              description: Total de ocorrências da consulta
              schema:
                type: integer
              example: 123
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/EmpresaResponse'
              examples:
                Lista de empresas:
                  $ref: '#/components/examples/ListaEmpresaResponse'
        '401':
          $ref: '#/components/responses/AccessDenied'
  /nfe/{referencia}.xml:
    get:
      tags:
      - NFe
      summary: XML autorizado
      description: 'Devolve o XML da nota autorizada (nfeProc: NF-e + protocolo). O mesmo arquivo também pode ser baixado
        pelo caminho_xml_nota_fiscal devolvido na consulta.'
      parameters:
      - name: referencia
        in: path
        required: true
        schema:
          type: string
      responses:
        '200':
          description: XML
          content:
            application/xml:
              schema:
                type: string
        '404':
          description: Não encontrada
        '422':
          description: Nota ainda não autorizada
  /nfe/{referencia}.pdf:
    get:
      tags:
      - NFe
      summary: DANFE em PDF
      parameters:
      - name: referencia
        in: path
        required: true
        schema:
          type: string
      responses:
        '200':
          description: PDF
          content:
            application/pdf:
              schema:
                type: string
                format: binary
        '404':
          description: Não encontrada
        '422':
          description: Nota ainda não autorizada
  /arquivos/{caminho}:
    get:
      tags:
      - NFe
      summary: Download de XML/PDF pelo caminho devolvido nas respostas
      description: 'Os campos caminho_xml_nota_fiscal, caminho_danfe, caminho_xml_cancelamento, caminho_xml_carta_correcao,
        caminho_pdf_carta_correcao e caminho_xml (inutilização) apontam para esta rota. Formato: /arquivos/{cnpj}/{AAAAMM}/XMLs/{chave}-nfe.xml,
        -can.xml, -cce-NN.xml, -inu.xml e /arquivos/{cnpj}/{AAAAMM}/DANFEs/{chave}.pdf. Exige o token da empresa dona.'
      parameters:
      - name: caminho
        in: path
        required: true
        schema:
          type: string
      responses:
        '200':
          description: Arquivo
        '404':
          description: Não encontrado
  /status:
    get:
      tags:
      - NFe
      summary: Status do serviço
      description: 'Devolve a situação da API e da comunicação com a SEFAZ (cStat 107: em operação; 108 ou 109: paralisada).'
      security: []
      responses:
        '200':
          description: OK
          content:
            application/json:
              example:
                api: ok
                fila: 3
                sefaz:
                  cStat: '107'
                  xMotivo: Servico em Operacao
                  consultado_em: '2026-10-18T22:30:00-03:00'
components:
  securitySchemes:
    BasicAuth:
      type: http
      scheme: basic
      description: 'Usuário = token da empresa (um por ambiente), senha vazia. Authorization: Basic base64("TOKEN:")'
    BearerAuth:
      type: http
      scheme: bearer
      description: 'Alternativa aceita pelo CapyFiscal: Authorization: Bearer TOKEN. Mesmo token.'
  schemas:
    ErrorResponse:
      title: Erro
      type: object
      properties:
        codigo:
          type: string
          description: Código do erro.
        mensagem:
          type: string
          description: Mensagem do erro.
        erros:
          type: array
          description: Lista de erros.
          items:
            type: object
            properties:
              mensagem:
                type: string
                description: Mensagem do erro.
              campo:
                type: string
                description: Nome do campo que causou o erro.
    CancelamentoNFeRequest:
      title: Requisição de Cancelamento
      type: object
      required:
      - justificativa
      properties:
        justificativa:
          type: string
          description: Justificativa do cancelamento (15 a 255 caracteres)
          minLength: 15
          maxLength: 255
          example: Teste de cancelamento de nota fiscal
    CancelamentoNFeResponse:
      title: Resposta Cancelamento NFe
      type: object
      properties:
        status:
          type: string
          description: Status do cancelamento
          enum:
          - cancelado
          - erro_cancelamento
          example: cancelado
        status_sefaz:
          type: string
          description: Status na SEFAZ
          example: '135'
        mensagem_sefaz:
          type: string
          description: Mensagem descritiva da SEFAZ
          example: Evento registrado e vinculado a NF-e
        caminho_xml_cancelamento:
          type: string
          description: Caminho para download do XML de cancelamento
    InutilizacaoResponse:
      title: Resposta Inutilização
      type: object
      properties:
        status:
          type: string
          description: Status da inutilização
          enum:
          - autorizado
          - erro_autorizacao
          example: autorizado
        status_sefaz:
          type: string
          description: Status na SEFAZ
          example: '102'
        mensagem_sefaz:
          type: string
          description: Mensagem descritiva da SEFAZ
          example: Inutilizacao de numero homologado
        serie:
          type: string
          description: Série da numeração
          example: '1'
        numero_inicial:
          type: string
          description: Número inicial inutilizado
          example: '999'
        numero_final:
          type: string
          description: Número final inutilizado
          example: '1000'
        modelo:
          type: string
          description: Modelo do documento (55 para NFe)
          example: '55'
        cnpj:
          type: string
          description: CNPJ da empresa
          example: '12345678000123'
        caminho_xml:
          type: string
          description: Caminho do XML para download
        protocolo_sefaz:
          type: string
          description: Número de protocolo da inutilização
          example: '135210002233889'
    NFeAutorizadaResponse:
