    NFeRequest:
      title: Dados da NFe
      type: object
      required:
      - natureza_operacao
      - data_emissao
      - tipo_documento
      - finalidade_emissao
      - items
      properties:
        natureza_operacao:
          type: string
          description: Descrição da natureza da operação a ser realizada pela nota fiscal
          example: Remessa
        data_emissao:
          type: string
          format: date-time
          description: Data da emissão da NFe (formato ISO)
          example: '2024-01-15T12:00:00-03:00'
        data_entrada_saida:
          type: string
          format: date-time
          description: Data de entrada ou saída da mercadoria
          example: '2024-01-15T12:00:00-03:00'
        tipo_documento:
          type: integer
          description: 'Tipo da NFe:

            - 0: Nota Fiscal de Entrada

            - 1: Nota Fiscal de Saída

            '
          enum:
          - 0
          - 1
          example: 1
        local_destino:
          type: integer
          description: 'Local onde a operação irá acontecer:

            - 1: Operação interna

            - 2: Operação interestadual

            - 3: Operação com exterior

            '
          enum:
          - 1
          - 2
          - 3
          example: 1
        finalidade_emissao:
          type: integer
          description: 'Finalidade da emissão da nota:

            - 1: Normal

            - 2: Complementar

            - 3: Nota de ajuste

            - 4: Devolução

            '
          enum:
          - 1
          - 2
          - 3
          - 4
          example: 1
        consumidor_final:
          type: integer
          description: 'Indica se a operação é com consumidor final:

            - 0: Normal

            - 1: Consumidor final

            '
          enum:
          - 0
          - 1
          example: 0
        presenca_comprador:
          type: integer
          description: 'Presença do comprador:

            - 0: Não se aplica

            - 1: Operação presencial

            - 2: Operação não presencial, pela Internet

            - 3: Operação não presencial, Teleatendimento

            - 4: NFC-e em operação com entrega em domicílio

            - 9: Operação não presencial, outros

            '
          enum:
          - 0
          - 1
          - 2
          - 3
          - 4
          - 9
          example: 1
        cnpj_emitente:
          type: string
          description: CNPJ do emitente (usar este ou cpf_emitente)
          example: '12345678000123'
        cpf_emitente:
          type: string
          description: CPF do emitente (usar este ou cnpj_emitente)
        nome_emitente:
          type: string
          description: Razão social do emitente
          example: ACME LTDA
        nome_fantasia_emitente:
          type: string
          description: Nome fantasia do emitente
        logradouro_emitente:
          type: string
          description: Logradouro do emitente
        numero_emitente:
          type: string
          description: Número do logradouro do emitente
        bairro_emitente:
          type: string
          description: Bairro do emitente
        municipio_emitente:
          type: string
          description: Município do emitente
        uf_emitente:
          type: string
          description: UF do emitente
          example: SP
        cep_emitente:
          type: string
          description: CEP do emitente
        inscricao_estadual_emitente:
          type: string
