        cnpj_destinatario:
          type: string
          description: CNPJ do destinatário (usar este ou cpf_destinatario)
        cpf_destinatario:
          type: string
          description: CPF do destinatário (usar este ou cnpj_destinatario)
        inscricao_estadual_destinatario:
          type: string
          description: Inscrição Estadual do destinatário
        indicador_inscricao_estadual_destinatario:
          type: integer
