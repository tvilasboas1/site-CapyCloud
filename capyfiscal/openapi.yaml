openapi: 3.0.3
info:
  title: CapyFiscal API
  version: '1.0'
  description: API de emissão de NF-e (modelo 55, layout 4.00) da Capycloud.
servers:
- url: https://api-fiscal.capycloud.com.br/v2
  description: Produção
- url: https://homologacao-fiscal.capycloud.com.br/v2
  description: Testes (homologação)
security:
- BasicAuth: []
- BearerAuth: []
tags:
- name: Notas fiscais
  description: Emitir, consultar, cancelar e corrigir notas. Usa o token da empresa.
- name: Numeração
  description: Inutilização de números que não serão usados.
- name: Arquivos
  description: Download do XML e do DANFE.
- name: Avisos (webhooks)
  description: Avisos automáticos para o seu sistema quando a nota muda de situação.
- name: Empresas
  description: Cadastro das empresas emissoras. Usa o token de integrador.
- name: Serviço
  description: Situação do serviço.
paths:
  /nfe:
    post:
      tags:
      - Notas fiscais
      summary: Emitir uma nota
      description: 'Recebe os dados da nota, confere e coloca na fila de envio à SEFAZ. A resposta vem na hora com `processando_autorizacao`;
        o resultado chega pelo aviso (webhook) ou pela consulta.


        **Reenvio com a mesma referência:** se a nota ainda está em processamento, volta `pending_operation`; se já foi autorizada,
        cancelada ou denegada, volta `already_processed`; se foi rejeitada (`erro_autorizacao`), os novos dados são aceitos
        como uma nova tentativa da mesma nota.'
      responses:
        '202':
          description: Recebida e na fila.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Nota'
              example:
                cnpj_emitente: '11222333000181'
                ref: venda-123
                status: processando_autorizacao
        '400':
          description: Referência ausente ou inválida.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Erro'
              example:
                codigo: requisicao_invalida
                mensagem: 'Parâmetro "ref" inválido: use letras, números, "-" e "_" (até 64 caracteres).'
        '401': &id001
          $ref: '#/components/responses/NaoAutorizado'
        '415': &id004
          $ref: '#/components/responses/SemCorpo'
        '422':
          description: Dados inválidos ou nota já em andamento.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Erro'
              example:
                codigo: erro_validacao_schema
                mensagem: Erro na validação dos dados da nota.
                erros:
                - campo: itens[1].cfop
                  mensagem: 'CFOP 6102 incompatível: saída com local_destino 1 pede CFOP iniciado em 5'
        '429': &id002
          $ref: '#/components/responses/LimiteExcedido'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/NFe'
      parameters:
      - name: ref
        in: query
        required: true
        schema:
          type: string
          pattern: ^[A-Za-z0-9_-]{1,64}$
        description: Referência única da nota no seu sistema (letras, números, - e _, até 64 caracteres). É por ela que você
          consulta, cancela e corrige a nota depois.
  /nfe/{referencia}:
    get:
      tags:
      - Notas fiscais
      summary: Consultar uma nota
      description: Devolve a situação atual da nota. Depois da autorização, traz a chave, o número, o protocolo e os caminhos
        do XML e do DANFE.
      responses:
        '200':
          description: Situação da nota.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Nota'
              example:
                cnpj_emitente: '11222333000181'
                ref: venda-123
                status: autorizado
                status_sefaz: '100'
                mensagem_sefaz: Autorizado o uso da NF-e
                chave_nfe: NFe35261111222333000181550010000015321000015320
                numero: '1532'
                serie: '1'
                protocolo: '135260000123456'
                caminho_xml_nota_fiscal: /arquivos/11222333000181/202611/XMLs/35261111222333000181550010000015321000015320-nfe.xml
                caminho_danfe: /arquivos/11222333000181/202611/DANFEs/35261111222333000181550010000015321000015320.pdf
        '401': *id001
        '404': &id003
          $ref: '#/components/responses/NaoEncontrado'
        '429': *id002
      parameters:
      - &id005
        name: referencia
        in: path
        required: true
        schema:
          type: string
          pattern: ^[A-Za-z0-9_-]{1,64}$
        description: A referência que o seu sistema deu à nota no envio.
      - name: completa
        in: query
        required: false
        schema:
          type: integer
          enum:
          - 0
          - 1
        description: 1 = inclui os dados enviados e o protocolo completo da SEFAZ.
    delete:
      tags:
      - Notas fiscais
      summary: Cancelar uma nota
      description: Cancela uma nota autorizada. A resposta já traz o resultado da SEFAZ. O prazo legal para cancelar é de
        24 horas depois da autorização na maioria das UFs.
      responses:
        '200':
          description: Resultado do cancelamento.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CancelamentoResultado'
              example:
                status: cancelado
                status_sefaz: '135'
                mensagem_sefaz: Evento registrado e vinculado a NF-e
                caminho_xml_cancelamento: /arquivos/11222333000181/202611/XMLs/35261111222333000181550010000015321000015320-can.xml
        '400':
          description: Justificativa fora do tamanho ou nota não autorizada.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Erro'
              example:
                codigo: requisicao_invalida
                mensagem: Parâmetro "justificativa" deve ter entre 15 e 255 caracteres.
        '401': *id001
        '404': *id003
        '415': *id004
        '422':
          description: A nota já foi cancelada.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Erro'
              example:
                codigo: already_processed
                mensagem: A nota fiscal já foi cancelada.
        '429': *id002
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/Cancelamento'
      parameters:
      - *id005
  /nfe/{referencia}/carta_correcao:
    post:
      tags:
      - Notas fiscais
      summary: Emitir carta de correção
      description: 'Corrige informações de uma nota autorizada. A resposta já traz o resultado da SEFAZ. Cada nota aceita
        até 20 cartas; a mais recente substitui as anteriores.


        A carta de correção não pode alterar valores, impostos, dados cadastrais que mudem o emitente ou o destinatário, nem
        a data de emissão ou de saída.'
      responses:
        '200':
          description: Resultado da carta de correção.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CartaCorrecaoResultado'
        '400':
          description: Texto fora do tamanho ou nota não autorizada.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Erro'
              example:
                codigo: nfe_nao_autorizada
                mensagem: Nota fiscal não autorizada.
        '401': *id001
        '404': *id003
        '415': *id004
        '422':
          description: Limite de cartas atingido.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Erro'
              example:
                codigo: limite_cartas
                mensagem: Limite de 20 cartas de correção atingido para esta nota.
        '429': *id002
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CartaCorrecao'
      parameters:
      - *id005
  /nfe/inutilizacao:
    post:
      tags:
      - Numeração
      summary: Inutilizar numeração
      description: 'Informa à SEFAZ que uma faixa de números não será usada. No dia a dia não é preciso: o CapyFiscal controla
        a numeração e não pula números. Use quando a numeração de outro emissor deixou um buraco.'
      responses:
        '200':
          description: Resultado da inutilização.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/InutilizacaoResultado'
        '400':
          description: Parâmetros ausentes ou inválidos.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Erro'
              example:
                codigo: requisicao_invalida
                mensagem: 'Parâmetros obrigatórios: justificativa.'
        '401': *id001
        '415': *id004
        '429': *id002
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/Inutilizacao'
  /nfe/inutilizacoes:
    get:
      tags:
      - Numeração
      summary: Listar inutilizações
      description: Lista as faixas inutilizadas de uma empresa, das mais recentes para as mais antigas.
      responses:
        '200':
          description: Lista de inutilizações.
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/InutilizacaoResultado'
        '400':
          description: CNPJ não informado.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Erro'
              example:
                codigo: requisicao_invalida
                mensagem: Parâmetros "cnpj" ou "cpf" não informados.
        '401': *id001
        '429': *id002
      parameters:
      - name: cnpj
        in: query
        required: true
        schema: &id006
          type: string
        description: CNPJ da empresa.
      - name: data_recebimento_inicial
        in: query
        schema:
          type: string
          format: date
      - name: data_recebimento_final
        in: query
        schema:
          type: string
          format: date
      - name: numero_inicial
        in: query
        schema:
          type: integer
      - name: numero_final
        in: query
        schema:
          type: integer
  /nfe/{referencia}/hook:
    post:
      tags:
      - Avisos (webhooks)
      summary: Reenviar o aviso de uma nota
      description: Manda de novo o aviso da situação atual da nota para todos os endereços cadastrados. Útil para testes ou
        para recuperar um aviso que o seu sistema perdeu.
      responses:
        '200':
          description: Avisos agendados.
          content:
            application/json:
              schema:
                type: array
                items:
                  type: object
                  properties:
                    id: *id006
                    event: *id006
        '401': *id001
        '404': *id003
        '429': *id002
      parameters:
      - *id005
  /nfe/{referencia}.xml:
    get:
      tags:
      - Arquivos
      summary: Baixar o XML autorizado
      description: Atalho pela referência. O mesmo arquivo pode ser baixado pelo caminho devolvido na consulta.
      responses:
        '200':
          description: Arquivo.
          content:
            application/xml:
              schema:
                type: string
                format: binary
        '401': *id001
        '404': *id003
        '422':
          description: A nota ainda não foi autorizada.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Erro'
              example:
                codigo: nfe_nao_autorizada
                mensagem: Nota ainda não autorizada.
        '429': *id002
      parameters:
      - *id005
  /nfe/{referencia}.pdf:
    get:
      tags:
      - Arquivos
      summary: Baixar o DANFE em PDF
      description: Atalho pela referência. O mesmo arquivo pode ser baixado pelo caminho devolvido na consulta.
      responses:
        '200':
          description: Arquivo.
          content:
            application/pdf:
              schema:
                type: string
                format: binary
        '401': *id001
        '404': *id003
        '422':
          description: A nota ainda não foi autorizada.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Erro'
              example:
                codigo: nfe_nao_autorizada
                mensagem: Nota ainda não autorizada.
        '429': *id002
      parameters:
      - *id005
  /arquivos/{cnpj}/{periodo}/{pasta}/{arquivo}:
    get:
      tags:
      - Arquivos
      summary: Baixar um arquivo pelo caminho
      description: Os campos `caminho_...` das respostas apontam para esta rota. Ela fica no endereço do servidor, sem o `/v2`,
        e exige o token da empresa dona do arquivo (ou o de integrador).
      responses:
        '200':
          description: Arquivo (XML ou PDF).
          content:
            application/octet-stream:
              schema:
                type: string
                format: binary
        '401': *id001
        '404':
          description: Arquivo não encontrado.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Erro'
              example:
                codigo: nao_encontrado
                mensagem: Arquivo não encontrado.
        '429': *id002
      parameters:
      - name: cnpj
        in: path
        required: true
        schema: *id006
      - name: periodo
        in: path
        required: true
        schema: *id006
        description: Ano e mês da emissão (AAAAMM).
      - name: pasta
        in: path
        required: true
        schema:
          type: string
          enum:
          - XMLs
          - DANFEs
      - name: arquivo
        in: path
        required: true
        schema: *id006
      servers:
      - url: https://api-fiscal.capycloud.com.br
        description: Produção
      - url: https://homologacao-fiscal.capycloud.com.br
        description: Testes
  /hooks:
    post:
      tags:
      - Avisos (webhooks)
      summary: Cadastrar um endereço de aviso
      description: 'Cadastra o endereço do seu sistema que vai receber os avisos. Guarde o `segredo_hmac` da resposta: ele
        não aparece de novo.'
      responses:
        '200':
          description: Gatilho criado.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/GatilhoNovo'
        '400':
          description: Evento ou URL inválidos.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Erro'
              example:
                codigo: requisicao_invalida
                mensagem: Parâmetro "url" deve começar com http:// ou https://.
        '401': *id001
        '415': *id004
        '429': *id002
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/GatilhoCadastro'
    get:
      tags:
      - Avisos (webhooks)
      summary: Listar endereços de aviso
      description: Lista os gatilhos ativos visíveis para o token.
      responses:
        '200':
          description: Lista.
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/Gatilho'
        '401': *id001
        '429': *id002
  /hooks/{id}:
    get:
      tags:
      - Avisos (webhooks)
      summary: Consultar um endereço de aviso
      description: Devolve um gatilho pelo id.
      responses:
        '200':
          description: Gatilho.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Gatilho'
        '401': *id001
        '404':
          description: Gatilho não encontrado.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Erro'
              example:
                codigo: nao_encontrado
                mensagem: Gatilho não encontrado
        '429': *id002
      parameters:
      - name: id
        in: path
        required: true
        schema: *id006
    delete:
      tags:
      - Avisos (webhooks)
      summary: Excluir um endereço de aviso
      description: Para de enviar avisos para este endereço.
      responses:
        '200':
          description: Gatilho excluído.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Gatilho'
        '401': *id001
        '404':
          description: Gatilho não encontrado.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Erro'
              example:
                codigo: nao_encontrado
                mensagem: Gatilho não encontrado
        '429': *id002
      parameters:
      - name: id
        in: path
        required: true
        schema: *id006
  /empresas:
    post:
      tags:
      - Empresas
      summary: Cadastrar uma empresa
      description: Cadastra uma empresa emissora e já devolve os dois tokens dela, de produção e de testes. Os tokens aparecem
        só nesta resposta. Exige o token de integrador.
      responses:
        '200':
          description: Empresa cadastrada (ou simulação, com dry_run=1).
          content:
            application/json:
              schema:
                oneOf:
                - $ref: '#/components/schemas/EmpresaCriada'
                - $ref: '#/components/schemas/Simulacao'
        '401': *id001
        '415': *id004
        '422': &id007
          description: Dados inválidos.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Erro'
              example:
                codigo: erro_validacao
                mensagem: Erro de validação
                erros:
                - campo: codigo_municipio
                  mensagem: código IBGE do município deve ter 7 dígitos
        '429': *id002
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/EmpresaNova'
      parameters:
      - &id009
        name: dry_run
        in: query
        required: false
        schema:
          type: integer
          enum:
          - 0
          - 1
        description: 1 = só confere os dados, sem gravar nada.
    get:
      tags:
      - Empresas
      summary: Listar empresas
      description: Lista as empresas do integrador, 50 por página.
      responses:
        '200':
          description: Lista.
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/Empresa'
        '401': *id001
        '429': *id002
      parameters:
      - name: cnpj
        in: query
        schema: *id006
        description: Filtra por CNPJ.
      - name: offset
        in: query
        schema:
          type: integer
          default: 0
        description: Quantos registros pular.
  /empresas/{id}:
    get:
      tags:
      - Empresas
      summary: Consultar uma empresa
      description: Devolve os dados de uma empresa.
      responses:
        '200':
          description: Empresa.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Empresa'
        '401': *id001
        '404':
          description: Empresa não encontrada.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Erro'
              example:
                codigo: nao_encontrado
                mensagem: Empresa não encontrada.
        '429': *id002
      parameters:
      - &id008
        name: id
        in: path
        required: true
        schema:
          type: integer
    put:
      tags:
      - Empresas
      summary: Alterar uma empresa
      description: Altera os campos enviados. Para trocar o certificado, envie `arquivo_certificado_base64` e `senha_certificado`.
      responses:
        '200':
          description: Empresa alterada (ou simulação, com dry_run=1).
          content:
            application/json:
              schema:
                oneOf:
                - $ref: '#/components/schemas/Empresa'
                - $ref: '#/components/schemas/Simulacao'
        '401': *id001
        '404':
          description: Empresa não encontrada.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Erro'
              example:
                codigo: nao_encontrado
                mensagem: Empresa não encontrada.
        '415': *id004
        '422': *id007
        '429': *id002
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/EmpresaAlteracao'
      parameters:
      - *id008
      - *id009
    delete:
      tags:
      - Empresas
      summary: Desativar uma empresa
      description: Desativa a empresa e revoga os tokens dela. As notas já emitidas continuam guardadas pelo prazo legal.
      responses:
        '200':
          description: Empresa desativada.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Empresa'
        '401': *id001
        '404':
          description: Empresa não encontrada.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Erro'
              example:
                codigo: nao_encontrado
                mensagem: Empresa não encontrada.
        '429': *id002
      parameters:
      - *id008
  /status:
    get:
      tags:
      - Serviço
      summary: Situação do serviço
      description: Mostra se a API está no ar e a última situação conhecida da SEFAZ. Não exige token.
      responses:
        '200':
          description: Situação.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Status'
      security: []
components:
  securitySchemes:
    BasicAuth:
      type: http
      scheme: basic
      description: Usuário = token, senha em branco.
    BearerAuth:
      type: http
      scheme: bearer
      description: 'Authorization: Bearer TOKEN'
  schemas:
    NFe:
      type: object
      properties:
        natureza_operacao:
          type: string
          maxLength: 60
          minLength: 1
          description: 'Natureza da operação, como aparece na nota. Ex.: Venda de mercadoria.'
        data_emissao:
          type: string
          description: 'Data e hora da emissão em ISO 8601, com fuso horário. Ex.: 2026-11-03T10:15:00-03:00.'
        tipo_documento:
          type: integer
          description: 0 = entrada, 1 = saída.
        local_destino:
          type: integer
          description: 1 = operação interna, 2 = interestadual, 3 = com o exterior.
        finalidade_emissao:
          type: integer
          default: 1
          description: 1 = normal, 2 = complementar, 3 = ajuste, 4 = devolução.
        consumidor_final:
          type: integer
          default: 1
          description: 0 = normal, 1 = consumidor final.
        presenca_comprador:
          type: integer
          default: 1
          description: 0 = não se aplica, 1 = presencial, 2 = pela internet, 3 = por telefone, 5 = presencial fora do estabelecimento,
            9 = outros.
        cnpj_emitente:
          type: string
          nullable: true
          description: Opcional. Se informado, precisa ser o CNPJ da empresa dona do token. Os demais dados do emitente vêm
            do cadastro da empresa.
        cpf_destinatario:
          type: string
          nullable: true
          description: CPF do destinatário. Informe CPF ou CNPJ, nunca os dois.
        cnpj_destinatario:
          type: string
          nullable: true
          description: CNPJ do destinatário. Informe CPF ou CNPJ, nunca os dois.
        nome_destinatario:
          type: string
          maxLength: 60
          minLength: 2
          description: Nome ou razão social do destinatário.
        indicador_inscricao_estadual_destinatario:
          type: integer
          nullable: true
          description: 1 = contribuinte do ICMS, 2 = contribuinte isento, 9 = não contribuinte. Para CPF é sempre 9 e é preenchido
            automaticamente.
        inscricao_estadual_destinatario:
          type: string
          nullable: true
          description: Inscrição estadual do destinatário, quando houver.
        logradouro_destinatario:
          type: string
          maxLength: 60
          minLength: 2
          description: Logradouro do destinatário.
        numero_destinatario:
          type: string
          maxLength: 60
          minLength: 1
          description: Número do endereço. Aceita texto, como SN.
        bairro_destinatario:
          type: string
          maxLength: 60
          minLength: 2
          description: Bairro do destinatário.
        codigo_municipio_destinatario:
          type: string
          description: Código IBGE do município, com 7 dígitos. Precisa ser da mesma UF de uf_destinatario.
        municipio_destinatario:
          type: string
          maxLength: 60
          minLength: 2
          description: Nome do município do destinatário.
        uf_destinatario:
          type: string
          maxLength: 2
          minLength: 2
          description: Sigla da UF do destinatário.
        cep_destinatario:
          type: string
          description: CEP do destinatário, com 8 dígitos.
        email_destinatario:
          type: string
          nullable: true
          description: E-mail do destinatário, gravado na nota.
        modalidade_frete:
          type: integer
          default: 9
          description: 0 = por conta do emitente, 1 = do destinatário, 2 = de terceiros, 3 = transporte próprio do remetente,
            4 = transporte próprio do destinatário, 9 = sem frete.
        valor_frete:
          type: number
          default: 0
          description: Valor total do frete.
        valor_seguro:
          type: number
          default: 0
          description: Valor total do seguro.
        valor_desconto:
          type: number
          default: 0
          description: Valor total do desconto.
        valor_outras_despesas:
          type: number
          default: 0
          description: Valor das outras despesas acessórias.
        valor_produtos:
          type: number
          nullable: true
          description: Soma do valor_bruto dos itens que entram no total. Se não for enviado, é calculado; se for, precisa
            bater.
        valor_total:
          type: number
          nullable: true
          description: Produtos − desconto + frete + seguro + outras despesas. Se não for enviado, é calculado; se for, precisa
            bater.
        itens:
          items:
            $ref: '#/components/schemas/Item'
          type: array
          description: Itens da nota, pelo menos um, com numero_item em sequência a partir de 1. O nome items também é aceito.
        formas_pagamento:
          items:
            $ref: '#/components/schemas/FormaPagamento'
          type: array
          description: Obrigatório em nota de saída. A soma dos valores precisa ser igual a valor_total (exceto quando a forma
            é 90, sem pagamento).
        informacoes_adicionais_contribuinte:
          maxLength: 5000
          type: string
          nullable: true
          description: Informações complementares, impressas no DANFE.
      required:
      - natureza_operacao
      - data_emissao
      - tipo_documento
      - local_destino
      - nome_destinatario
      - logradouro_destinatario
      - numero_destinatario
      - bairro_destinatario
      - codigo_municipio_destinatario
      - municipio_destinatario
      - uf_destinatario
      - cep_destinatario
      example:
        natureza_operacao: Venda de mercadoria
        data_emissao: '2026-11-03T10:15:00-03:00'
        tipo_documento: 1
        local_destino: 1
        cpf_destinatario: '12345678909'
        nome_destinatario: Maria da Silva
        logradouro_destinatario: Rua das Flores
        numero_destinatario: '120'
        bairro_destinatario: Centro
        codigo_municipio_destinatario: '3550308'
        municipio_destinatario: São Paulo
        uf_destinatario: SP
        cep_destinatario: '01001000'
        itens:
        - numero_item: 1
          codigo_produto: CAM-001
          descricao: Camiseta algodão M
          codigo_ncm: '61091000'
          cfop: '5102'
          unidade_comercial: UN
          quantidade_comercial: 2
          valor_unitario_comercial: 49.9
          icms_origem: 0
          icms_situacao_tributaria: '102'
          pis_situacao_tributaria: '07'
          cofins_situacao_tributaria: '07'
        formas_pagamento:
        - forma_pagamento: '17'
          valor_pagamento: 99.8
      title: Nota fiscal (envio)
    Item:
      type: object
      properties:
        numero_item:
          type: integer
          maximum: 990
          minimum: 1
          description: Número do item, de 1 a 990, em sequência.
        codigo_produto:
          type: string
          maxLength: 60
          minLength: 1
          description: Código do produto no seu sistema.
        descricao:
          type: string
          maxLength: 120
          minLength: 1
          description: Descrição do produto.
        codigo_ncm:
          type: string
          description: NCM com 8 dígitos.
        cfop:
          type: string
          description: 'CFOP com 4 dígitos. O primeiro dígito precisa combinar com a operação: saída interna 5, interestadual
            6, exterior 7; entrada interna 1, interestadual 2, exterior 3.'
        unidade_comercial:
          type: string
          maxLength: 6
          minLength: 1
          description: Unidade de venda, como UN, KG ou CX.
        quantidade_comercial:
          type: number
          description: Quantidade, maior que zero.
        valor_unitario_comercial:
          type: number
          description: Valor unitário, maior que zero.
        valor_bruto:
          type: number
          nullable: true
          description: Quantidade × valor unitário. Se não for enviado, é calculado; se for, precisa bater.
        inclui_no_total:
          type: integer
          default: 1
          description: 1 = soma no total da nota, 0 = não soma.
        icms_origem:
          type: integer
          maximum: 8
          minimum: 0
          description: Origem da mercadoria, de 0 a 8 (0 = nacional).
        icms_situacao_tributaria:
          type: string
          description: CST do ICMS (2 dígitos, regime normal) ou CSOSN (3 dígitos, Simples Nacional).
        icms_modalidade_base_calculo:
          type: integer
          nullable: true
          description: Modalidade da base de cálculo do ICMS. Na CST 20, se não for enviada, usa 3 (valor da operação).
        icms_reducao_base_calculo:
          type: number
          nullable: true
          description: Percentual de redução da base de cálculo. Obrigatório na CST 20.
        icms_base_calculo:
          type: number
          nullable: true
          description: Base de cálculo do ICMS. Na CST 20, é calculada se não for enviada.
        icms_aliquota:
          type: number
          nullable: true
          description: Alíquota do ICMS, em %. Obrigatória na CST 20.
        icms_valor:
          type: number
          nullable: true
          description: Valor do ICMS. Na CST 20, é calculado se não for enviado.
        pis_situacao_tributaria:
          type: string
          description: CST do PIS.
        cofins_situacao_tributaria:
          type: string
          description: CST da COFINS.
        codigo_beneficio_fiscal:
          type: string
          nullable: true
          description: Código de benefício fiscal (cBenef), quando a UF exigir. Vale só para CST 20, 30, 40, 41, 50, 51, 70
            e 90.
        ibs_cbs_situacao_tributaria:
          type: string
          nullable: true
          description: CST do IBS e da CBS, quando aplicável.
        ibs_cbs_classificacao_tributaria:
          type: string
          nullable: true
          description: Classificação tributária do IBS e da CBS (cClassTrib), quando aplicável.
      required:
      - numero_item
      - codigo_produto
      - descricao
      - codigo_ncm
      - cfop
      - unidade_comercial
      - quantidade_comercial
      - valor_unitario_comercial
      - icms_origem
      - icms_situacao_tributaria
      - pis_situacao_tributaria
      - cofins_situacao_tributaria
    FormaPagamento:
