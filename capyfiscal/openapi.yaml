            - 1: Contribuinte ICMS

            - 2: Contribuinte isento

            - 9: Não Contribuinte

            '
          enum:
          - 1
          - 2
          - 9
        logradouro_destinatario:
          type: string
          description: Logradouro do destinatário
        numero_destinatario:
          type: string
          description: Número do logradouro do destinatário
        bairro_destinatario:
          type: string
          description: Bairro do destinatário
        municipio_destinatario:
          type: string
          description: Município do destinatário
        uf_destinatario:
          type: string
          description: UF do destinatário
        cep_destinatario:
          type: string
          description: CEP do destinatário
        pais_destinatario:
          type: string
          description: País do destinatário
          example: Brasil
        telefone_destinatario:
          type: string
          description: Telefone do destinatário
        valor_frete:
          type: number
          format: float
          description: Valor total do frete
          example: 0
        valor_seguro:
          type: number
          format: float
          description: Valor total do seguro
          example: 0
        valor_desconto:
          type: number
          format: float
          description: Valor total do desconto
          example: 0
        valor_outras_despesas:
          type: number
          format: float
          description: Valor das despesas acessórias
          example: 0
        valor_total:
          type: number
          format: float
          description: Valor total da nota fiscal
          example: 47.23
        valor_produtos:
          type: number
          format: float
          description: Valor total dos produtos
          example: 47.23
        modalidade_frete:
          type: integer
          description: 'Modalidade do frete:

            - 0: Por conta do emitente

            - 1: Por conta do destinatário

            - 2: Por conta de terceiros

            - 9: Sem frete

            '
          enum:
          - 0
          - 1
          - 2
          - 9
          example: 0
        items:
          type: array
          description: Lista de itens da NFe
          items:
            $ref: '#/components/schemas/ItemNFe'
      description: Payload de emissão. Este schema lista os campos principais; o payload completo aceita todos os campos da
        NF-e 4.00. Os nomes "items" e "itens" são aceitos.
    ItemNFe:
      title: Item da NFe
      type: object
      required:
      - numero_item
      - codigo_produto
      - descricao
      - cfop
      - quantidade_comercial
      - valor_unitario_comercial
      - valor_bruto
      - codigo_ncm
      properties:
        numero_item:
          type: integer
          description: Numeração sequencial do item (começando em 1)
          example: 1
        codigo_produto:
          type: string
          description: Código do produto
          example: '1232'
        descricao:
          type: string
          description: Descrição do produto
          example: Cartões de Visita
        cfop:
          type: string
          description: Código Fiscal da Operação
          example: '5923'
        quantidade_comercial:
          type: number
          format: float
          description: Quantidade da mercadoria
          example: 100
        quantidade_tributavel:
          type: number
          format: float
          description: Quantidade tributável da mercadoria
          example: 100
        valor_unitario_comercial:
          type: number
          format: float
          description: Valor unitário da mercadoria
          example: 0.4723
        valor_unitario_tributavel:
          type: number
          format: float
          description: Valor unitário tributável da mercadoria
          example: 0.4723
        unidade_comercial:
          type: string
          description: Unidade comercial do produto
          example: UN
        unidade_tributavel:
          type: string
          description: Unidade tributável do produto
          example: UN
        valor_bruto:
          type: number
          format: float
          description: Valor bruto do produto
          example: 47.23
        codigo_ncm:
          type: string
          description: Código NCM do produto (8 dígitos)
          example: '49111090'
        inclui_no_total:
          type: integer
          description: 'Valor do item compõe valor total da NFe:

            - 0: Não

            - 1: Sim

            '
          enum:
          - 0
          - 1
          example: 1
        icms_origem:
          type: integer
          description: 'Origem do ICMS:

            - 0: Nacional

            - 1: Estrangeira (importação direta)

            - 2: Estrangeira (adquirida no mercado interno)

            - 3: Nacional com mais de 40% de conteúdo estrangeiro

            - 4: Nacional produzida através de processos produtivos básicos

            - 5: Nacional com menos de 40% de conteúdo estrangeiro

            - 6: Estrangeira (importação direta) sem produto nacional similar

            - 7: Estrangeira (adquirida no mercado interno) sem produto nacional similar

            '
          example: 0
        icms_situacao_tributaria:
          type: string
          description: Situação tributária do ICMS
          example: '41'
        pis_situacao_tributaria:
          type: string
          description: Situação tributária do PIS
          example: '07'
        cofins_situacao_tributaria:
          type: string
          description: Situação tributária do COFINS
          example: '07'
    EnvioEmailRequest:
      title: Requisição de Envio de Email
      type: object
      required:
      - emails
      properties:
        emails:
          type: array
          description: Lista de emails que receberão a nota (máximo 10)
          maxItems: 10
          items:
            type: string
            format: email
          example:
          - email1@exemplo.com
          - email2@exemplo.com
    InutilizacaoRequest:
      title: Requisição de Inutilização
      type: object
      required:
      - cnpj
      - serie
      - numero_inicial
      - numero_final
      - justificativa
      properties:
        cnpj:
          type: string
          description: CNPJ da empresa emitente
          example: '12345678000123'
        serie:
          type: string
          description: Série da numeração da NFe
          example: '1'
        numero_inicial:
          type: integer
          description: Número inicial a ser inutilizado
          example: 7
        numero_final:
          type: integer
          description: Número final a ser inutilizado
          example: 9
        justificativa:
          type: string
          description: Justificativa da inutilização (mínimo 15 caracteres)
          minLength: 15
          example: Teste de inutilização de nota
    Hook:
      title: Gatilho
      type: object
